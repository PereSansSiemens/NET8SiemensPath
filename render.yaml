services:
  - type: web
    name: vaquersanspere-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: vaquersanspere-db
          property: connectionString

databases:
  - name: vaquersanspere-db
    plan: free
    databaseName: vaquersanspere
    user: vaquersanspere_user
